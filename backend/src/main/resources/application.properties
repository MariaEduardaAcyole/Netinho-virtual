# A API le as credenciais do ambiente ou de backend/.env (formato de propriedades).
spring.application.name=netinho
spring.config.import=optional:file:./.env[.properties]
# PORT permite que a plataforma de deploy escolha a porta; localmente usa 8080.
server.port=${PORT:8080}
# Credenciais obrigatorias para conectar ao schema Oracle.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Origens permitidas para chamadas do frontend pelo navegador.
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
# Login: AUTH_SECRET assina os tokens (minimo 32 caracteres); AUTH_ENABLED=false desliga o login (so para testes locais).
app.auth.enabled=${AUTH_ENABLED:true}
app.auth.secret=${AUTH_SECRET:}
app.auth.validade-horas=${AUTH_VALIDADE_HORAS:720}
# Token de administracao (minimo 32 caracteres): libera os CRUDs. Sem ele, so o app do idoso usa a API.
app.auth.admin-token=${ADMIN_TOKEN:}
# Analise de imagens no "E golpe?" (opcional): sem chave, so as regras de texto sao usadas.
# Claude tem prioridade quando as duas chaves existem.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-opus-5-5}
# Alternativa: modelo de visao da NVIDIA (usado so quando nao ha chave da Anthropic).
nvidia.api-key=${NVIDIA_API_KEY:}
nvidia.model=${NVIDIA_MODEL:nvidia/nemotron-3.5-super-vl-120b-a12b}
nvidia.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
# Conversa do botao de falar (Netinho com IA). Sem NVIDIA_API_KEY usa so palavras-chave.
nvidia.chat-model=${NVIDIA_CHAT_MODEL:google/gemma-4-31b-it}
