# A API le as credenciais do ambiente ou de backend/.env (formato de propriedades).
spring.application.name=netinho
spring.config.import=optional:file:./.env[.properties]
# PORT permite que a plataforma de deploy escolha a porta; localmente usa 8080.
server.port=${PORT:8080}
# Credenciais obrigatorias para conectar ao schema Oracle.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Origens permitidas para chamadas do frontend pelo navegador.
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
