# Netinho Virtual na VPS Hostinger.
# A API e o site entram na rede devlib_web, onde o Caddy compartilhado (devlib-caddy-1)
# recebe HTTPS em netinho.46-202-147-251.sslip.io e repassa:
#   /api/*  -> netinho-api:8080 (sem o prefixo /api)
#   resto   -> netinho-web:80   (arquivos de frontend/)
# A voz natural (voz/) fica so na rede interna: apenas a API chama netinho-voz:8000.
# Saude: o Dockerfile da API tem HEALTHCHECK em /saude; deploy/vigia.sh (cron) reinicia se ficar unhealthy.
# Subir/atualizar:  docker compose -p netinho up -d --build
services:
  api:
    build: ../backend
    image: netinho-api:local
    container_name: netinho-api
    restart: unless-stopped
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      PORT: "8080"
      FRONTEND_ORIGINS: "https://netinho.painelorg.tech,https://netinho.46-202-147-251.sslip.io"
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    mem_limit: 640m
    networks:
      web:
        aliases: [netinho-api]
      interno:

  voz:
    build: ./voz
    image: netinho-voz:local
    container_name: netinho-voz
    restart: unless-stopped
    env_file:
      - path: ../backend/.env
        required: false
    mem_limit: 160m
    networks:
      interno:
        aliases: [netinho-voz]

  web:
    image: nginx:1.27-alpine
    container_name: netinho-web
    restart: unless-stopped
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      web:
        aliases: [netinho-web]

networks:
  web:
    external: true
    name: devlib_web
  interno: {}
