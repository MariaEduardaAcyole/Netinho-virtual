# Serve o frontend estático. HTTPS e /api ficam com o Caddy compartilhado.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
    }
}
